<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>税金シミュレーター</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f7f9fc; padding: 10px; }
        .container { background-color: #fff; border-radius: 8px; padding: 20px; max-width: 600px; margin: auto; }
        h1 { text-align: center; font-size: 1.2rem; }
        .privacy { text-align: center; font-size: 8px; color: #e74c3c; margin-bottom: 20px; }
        .chart-container { height: 300px; width: 100%; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h1>あなたの収入、税金でどれくらい引かれてる？</h1>
    <p class="privacy">※入力データは一切収集されません</p>
    
    <div class="chart-container">
        <canvas id="taxChart"></canvas>
    </div>
    <div id="detailsList"></div>
</div>

<script>
    function drawChart(soc, incTax, resTax, consTax, spend, savings, remain) {
        const ctx = document.getElementById('taxChart').getContext('2d');
        if (window.taxChartInstance) window.taxChartInstance.destroy();

        window.taxChartInstance = new Chart(ctx, {
            type: 'pie',
            data: {
                labels: ['社会保険料', '所得税', '住民税', '消費税', '生活費', '貯金', '余り'],
                datasets: [{
                    data: [soc, incTax, resTax, consTax, spend, savings, remain],
                    backgroundColor: ['#3498db', '#f39c12', '#f1c40f', '#e74c3c', '#95a5a6', '#2ecc71', '#ecf0f1']
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { boxWidth: 12, font: { size: 10 } } // ラベルを小さく調整
                    }
                }
            }
        });
    }
</script>
</body>
</html>
